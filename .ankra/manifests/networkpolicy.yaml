apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: damn-vulnerable-flask-application
  labels:
    app.kubernetes.io/name: damn-vulnerable-flask-application
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: damn-vulnerable-flask-application
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - ports:
        - port: 5000
          protocol: TCP
