# Generated by Ankra. Dependabot opens a weekly pull request per ecosystem for
# minor and patch updates, one per major update, and one for security fixes.
# A release is offered once it has been public for a week; security fixes do
# not wait.
# Every one of them runs this repository's Ankra pipeline before it is merged.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
      pip-security:
        applies-to: "security-updates"
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
      docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"
